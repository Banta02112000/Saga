name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - name: Logic tests
        working-directory: web
        run: for t in test_core test_extras test_library test_imports test_games test_media test_books test_fixes511 test_secure test_storage test_058 test_059 test_061 test_062 test_064 test_065 test_066 test_069 test_0693 test_0695 test_0696 test_0697; do echo "== $t"; node $t.js || exit 1; done
      - name: Page tests
        working-directory: web
        run: for t in test_saga test_ui test_legacy test_books_ui test_persist test_bigimport test_probe test_blank test_bg test_site test_imports_all; do echo "== $t"; node $t.js /tmp/shots || exit 1; done
